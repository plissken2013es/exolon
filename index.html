<!DOCTYPE html>
<html>
  <head>
    <title>Exolon</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="css/exolon.css" />
    <style>
      #help a {
        color: #00dede;
      }
      /* inside the level editor: just the game */
      body.embedded {
        margin: 0;
        overflow: hidden;
      }
      body.embedded #page {
        width: auto;
      }
      body.embedded #info,
      body.embedded #help {
        display: none;
      }
      body.embedded #app {
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="info">
        <div id="sound"></div>
      </div>
      <div id="app">
        <div id="loading">
          THE GAME IS LOADING. PLEASE WAIT
        </div>
      </div>
      <div id="help">
        CONTROLS:<br />
        <strong>ARROWS</strong> - MOVEMENT, JUMP, DUCK<br />
        <strong>SPACE</strong> - FIRE<br />
        HOLD <strong>SPACE</strong> TO FIRE A GRENADE<br /><br />
        <a href="editor.html">LEVEL EDITOR</a>
      </div>
    </div>
    <script type="module" src="/phaser/src/main.js"></script>
  </body>
</html>
