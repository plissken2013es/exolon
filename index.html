<!DOCTYPE html>
<html>
  <head>
    <title>Exolon</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/exolon.css" />
    <style>
      #screen {
        position: relative;
        width: 512px;
        height: 384px;
      }
      #screen canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* the menu items are real links over the canvas */
      #screen a {
        position: absolute;
        left: 64px;
        width: 384px;
        height: 32px;
        color: transparent;
        overflow: hidden;
        outline: none;
      }
      #versions {
        margin-top: 35px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="page">
      <div id="info">&nbsp;</div>
      <div id="app">
        <div id="screen">
          <canvas id="menu" width="512" height="384"></canvas>
          <a href="exolon.html" style="top: 200px">Original version (melonJS, 2012)</a>
          <a href="phaser4/" style="top: 248px">Phaser 4 version</a>
        </div>
      </div>
      <div id="versions">
        <strong>ORIGINAL</strong> - THE 2012 HTML5 REMAKE, MADE WITH MELONJS<br />
        <strong>PHASER 4</strong> - THE SAME GAME, PORTED TO PHASER 4<br />
        <strong>ARROWS</strong> TO CHOOSE, <strong>SPACE</strong> TO PLAY
      </div>
    </div>
    <script>
      (function () {
        var canvas = document.getElementById("menu");
        var ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;
        var links = Array.prototype.slice.call(document.querySelectorAll("#screen a"));

        var ITEMS = [
          { text: "ORIGINAL  (MELONJS)", y: 208 },
          { text: "PHASER 4", y: 256 },
        ];
        var selected = 0;

        var names = ["title", "arrow", "star", "font_green", "font_cyan", "font_yellow", "font_purple", "font_red", "font_white"];
        var images = {};
        var pending = names.length;
        names.forEach(function (name) {
          var img = new Image();
          img.onload = function () {
            if (--pending === 0) {
              start();
            }
          };
          img.src = "images/" + name + ".gif";
          images[name] = img;
        });

        // the game fonts: 16x16 characters from space to "Z"
        function text(font, str, x, y) {
          for (var i = 0; i < str.length; i++) {
            var code = str.charCodeAt(i) - 32;
            ctx.drawImage(images[font], code * 16, 0, 16, 16, x + i * 16, y, 16, 16);
          }
        }

        // twinkling stars, like the title screen of the game
        var STAR_FRAMES = [0, 1, 2, 1, 3, 1, 2, 0];
        var stars = [];
        function newStar(star) {
          star.x = Math.floor(Math.random() * (512 - 32));
          star.y = Math.floor(Math.random() * (384 - 32));
          star.frame = 0;
          star.wait = Math.floor(Math.random() * 60);
          return star;
        }
        for (var i = 0; i < 10; i++) {
          stars.push(newStar({}));
        }

        var tick = 0;
        function draw() {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, 512, 384);

          stars.forEach(function (star) {
            if (star.wait > 0) {
              star.wait--;
              return;
            }
            ctx.drawImage(images.star, STAR_FRAMES[star.frame] * 32, 0, 32, 32, star.x, star.y, 32, 32);
            if (tick % 2 === 0 && ++star.frame === STAR_FRAMES.length) {
              newStar(star);
            }
          });

          ctx.drawImage(images.title, 128, 0);
          text("font_green", "BY  RAFFAELE CECCO", 112, 112);
          text("font_white", "CHOOSE A VERSION", 128, 160);
          ITEMS.forEach(function (item, i) {
            var x = 256 - item.text.length * 8;
            text(i === selected ? "font_yellow" : "font_cyan", item.text, x, item.y);
            if (i === selected) {
              ctx.drawImage(images.arrow, x + item.text.length * 16 + 16, item.y);
            }
          });
          text("font_cyan", "PRESS      TO PLAY", 112, 304);
          text("font_purple", "      FIRE        ", 112, 304);
          text("font_red", "EXOLON COPYRIGHT 1987 HEWSON", 32, 368);

          tick++;
          requestAnimationFrame(draw);
        }

        function start() {
          requestAnimationFrame(draw);
        }

        function select(i) {
          selected = (i + ITEMS.length) % ITEMS.length;
        }

        links.forEach(function (link, i) {
          link.addEventListener("mouseenter", function () {
            select(i);
          });
          link.addEventListener("focus", function () {
            select(i);
          });
        });

        window.addEventListener("keydown", function (event) {
          if (event.code === "ArrowUp" || event.code === "ArrowLeft") {
            select(selected - 1);
          } else if (event.code === "ArrowDown" || event.code === "ArrowRight") {
            select(selected + 1);
          } else if (event.code === "Space" || event.code === "Enter") {
            location.href = links[selected].href;
          } else {
            return;
          }
          event.preventDefault();
        });
      })();
    </script>
  </body>
</html>
